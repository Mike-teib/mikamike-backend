name: MikaMike UI preview

on:
  push:
    branches:
      - ui/mikamike-responsive-v1-20260927
    paths:
      - "frontend-vnext/**"
      - ".github/workflows/ui-preview-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mikamike-ui-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static UI
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend-vnext

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
