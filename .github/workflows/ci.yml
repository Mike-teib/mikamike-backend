name: CI

on:
  push:
    branches: [main, "cloud/mikamike-release-candidate-*"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: lint + tests (hors ligne)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Secrets de TEST factices : aucune clé réelle n'est nécessaire à la CI.
      MIKA_JWT_SECRET: test-jwt-secret-not-for-prod-0123456789
      MIKA_PSEUDO_SECRET: test-pseudo-secret-not-for-prod-0123456789
      MIKA_DB_URL: sqlite:////tmp/mika_ci.db
      BILLING_DB_URL: sqlite:////tmp/billing_ci.db
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Installer
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      # Node 22 AVANT pytest : tests_cloud/test_frontend_contract_pkg.py exécute le TypeScript
      # nativement (Node ≥ 22.18) et le vérificateur de contrat contre un serveur réel.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-contract/package-lock.json
      - name: Tests (pytest, hors ligne)
        run: python -m pytest -q
      - name: Migrations — tests de validation (neuve, historique, stamp, downgrade, version incorrecte, interruption)
        run: python -m pytest -q tests_cloud/test_migrations.py tests_cloud/test_migrations_validation.py
      - name: Contrat front (dérive de l'API + vérificateur Node contre un serveur réel)
        run: python -m pytest -q tests_cloud/test_contrat_front.py
      - name: RC1 — E2E complet en enforce, BOLA, moteur de progression, publication
        run: >-
          python -m pytest -q tests_cloud/test_e2e_release.py tests_cloud/test_securite_rc1.py
          tests_cloud/test_progression_api_s5.py tests_cloud/test_publication_rc1.py
      - name: RC1 — migrations (matrice de toutes les têtes, rollback runbook, reprise)
        run: python -m pytest -q tests_cloud/test_migrations_rc1.py
      - name: RC1 — dataset synthétique de staging (génération déterministe + import VALIDATED)
        run: |
          python -m tools.staging_dataset generer --sortie /tmp/staging_rc1
          python -m pytest -q tests_cloud/test_staging_dataset.py
      - name: RC1 — artefacts réels attendus (état, sans bloquer la CI)
        run: python -m tools.artefacts verifier --dossier /tmp/aucun-artefact || test $? -eq 4
      - name: Import — harnais synthétique et performance (aucun artefact réel)
        run: python -m pytest -q tests_cloud/test_import_harnais.py tests_cloud/test_import_perf.py
      - name: Garde-fou contenu (fixtures, existant, catalogue)
        run: python -m tools.content_check
      - name: R6 — audit symbolique du catalogue historique (lecture seule, échoue sur faux positif)
        run: python -m tools.audit_equivalence --sortie /tmp/equivalence
      - name: Rapports reproductibles (backlog + audit dédup)
        run: |
          python -m tools.rapports --sortie /tmp/r1
          python -m tools.rapports --sortie /tmp/r2
          diff -r /tmp/r1 /tmp/r2
      - name: Migrations (bases SQLite jetables) — upgrade, status, downgrade, re-upgrade
        env:
          MIKA_DB_URL: sqlite:////tmp/mika_migr.db
          BILLING_DB_URL: sqlite:////tmp/billing_migr.db
        run: |
          python -m tools.db upgrade
          python -m tools.db status
          python -m tools.db stamp-existant mika && exit 1 || echo "stamp sur base versionnée : refusé (attendu)"
          python -m tools.db downgrade mika base
          python -m tools.db downgrade billing base
          python -m tools.db upgrade
          python -m tools.db status

  mutation:
    name: mutation (bugs injectés, tous doivent être tués)
    runs-on: ubuntu-latest
    # ~80 mutants (session 3) : suites ciblées, sur une COPIE jetable du dépôt.
    timeout-minutes: 60
    env:
      MIKA_JWT_SECRET: test-jwt-secret-not-for-prod-0123456789
      MIKA_PSEUDO_SECRET: test-pseudo-secret-not-for-prod-0123456789
      MIKA_DB_URL: sqlite:////tmp/mika_mut.db
      BILLING_DB_URL: sqlite:////tmp/billing_mut.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Installer
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      # La baseline rejoue toute la suite, dont le package front (TypeScript natif : Node ≥ 22.18).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-contract/package-lock.json
      - name: Mutation check (baseline verte exigée, erreurs de collecte non comptées)
        run: python -m tools.mutation_check

  frontend-contract:
    name: contrat front (package TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend-contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-contract/package-lock.json
      - name: Installer (versions épinglées, lockfile)
        run: npm ci
      - name: Typecheck strict
        run: npm run typecheck
      - name: Tests unitaires et contractuels (sans serveur)
        run: npm test

  security:
    name: sécurité (secrets, SAST, dépendances)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Outils
        run: pip install -r requirements-dev.txt
      - name: Scan de secrets (arbre + historique, valeurs masquées)
        run: python tools/secret_scan.py --history
      - name: SAST (bandit, sévérité moyenne+)
        run: bandit -q -r app paiement_comptes main.py tools migrations -ll
      - name: Audit des dépendances (pip-audit)
        run: pip-audit -r requirements.txt -r requirements-dev.txt

  rc-gate:
    name: verrou release candidate (tout doit être vert)
    if: always()
    needs: [tests, mutation, security, frontend-contract]
    runs-on: ubuntu-latest
    steps:
      - name: Exiger lint + tests + migrations + contrat + mutations + sécurité
        run: |
          echo "tests=${{ needs.tests.result }} mutation=${{ needs.mutation.result }} security=${{ needs.security.result }} frontend-contract=${{ needs.frontend-contract.result }}"
          test "${{ needs.tests.result }}" = success
          test "${{ needs.mutation.result }}" = success
          test "${{ needs.security.result }}" = success
          test "${{ needs.frontend-contract.result }}" = success
