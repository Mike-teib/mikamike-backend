[tool.pytest.ini_options]
testpaths = ["tests_mika", "tests_paiement", "tests_cloud"]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py311"
extend-exclude = [".venv", "venv"]

[tool.ruff.lint]
# Socle volontairement strict sur les ERREURS réelles (pyflakes + erreurs de syntaxe),
# sans imposer de reformatage massif du code historique.
select = ["E9", "F63", "F7", "F82", "F401", "F811", "F841", "B006", "S105", "S106", "S307"]

[tool.ruff.lint.per-file-ignores]
"tests_*/**" = ["S105", "S106"]
